[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kanbun-tokenizer"
version = "0.1.0"
description = "A research tokenizer for Classical Chinese (Literary Chinese)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["tokenizers>=0.21,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
